<ion-header>
  <ion-toolbar>
    <ion-title>My Workouts</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngIf="workouts.length > 0; else noWorkouts">
    <ion-item *ngFor="let workout of workouts">
      <ion-label>
        <h2>{{ workout.name }}</h2>
        <p>Rounds: {{ workout.rounds }}</p>
        <p>Rest Time: {{ workout.rest }} sec</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ng-template #noWorkouts>
    <ion-text color="medium">
      <p class="ion-text-center">No workouts saved.</p>
    </ion-text>
  </ng-template>
</ion-content>
